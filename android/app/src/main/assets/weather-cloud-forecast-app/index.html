<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Cloud Sea Forecast Lab | 云海观测决策台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="面向摄影、徒步与山地观测的专业云海观测决策工具，提供天气研判、观测建议、地图辅助与分享简报。">
  <meta name="theme-color" content="#0095ff">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/main.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div id="app-container">
    <header class="card app-header">
      <div class="header-eyebrow">Cloud Sea Forecast Lab</div>
      <h1>云海观测决策台</h1>
      <p class="header-subtitle">面向摄影、徒步与山地观测的专业天气研判工具</p>
      <div class="header-toolbar">
        <div id="controls-section">
          <input type="text" id="address" placeholder="输入地点（默认：北京）" autocomplete="off">
          <button id="search-btn" type="button">确认</button>
          <button id="locate-btn" type="button">📍 当前位置</button>
          <select id="daySelector" aria-label="选择日期"></select>
        </div>
      </div>
    </header>

    <div id="status-banner" class="card status-banner is-hidden" role="status" aria-live="polite"></div>

    <main id="main-content">
      <section id="left-panel" class="card panel">
        <div class="panel-head">
          <div>
            <div class="panel-eyebrow">Observation Dashboard</div>
            <h2 class="panel-title">观测条件总览</h2>
          </div>
        </div>
        <div id="map" aria-label="天气地图"></div>
        <section id="weather-dashboard" aria-live="polite"></section>
      </section>

      <section id="right-panel" class="card panel">
        <div class="panel-head">
          <div>
            <div class="panel-eyebrow">Hourly Timeline</div>
            <h2 class="panel-title">逐小时预报</h2>
          </div>
        </div>
        <section id="hourly-section">
          <div class="hourly-header">
            <div>时间</div>
            <div class="stat-header"><span>🌡️</span><span>温度</span></div>
            <div class="stat-header"><span>🌫️</span><span>云底高度</span></div>
            <div class="stat-header"><span>💦</span><span>降水概率</span></div>
          </div>
          <div id="hourly-forecast-list"></div>
        </section>
        <button id="sos-button" type="button">🆘 SOS 紧急求救</button>
      </section>
    </main>
  </div>

  <div id="sos-modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="sos-title">
      <h2 id="sos-title">紧急求救</h2>
      <p id="sos-instruction">点击下方按钮，准备生成包含您当前位置的求救信息。</p>
      <div id="sos-info-container" class="is-hidden">
        <pre id="sos-info"></pre>
        <div id="sos-actions"></div>
      </div>
      <button id="prepare-sos-btn" class="modal-button" type="button">准备求救信号</button>
      <button id="close-sos-btn" class="modal-button" type="button">关闭</button>
    </div>
  </div>

  <noscript>
    <div class="noscript-message">此页面需要启用 JavaScript 才能显示地图、天气与 SOS 功能。</div>
  </noscript>

  <script type="module" src="./scripts/app.js"></script>
</body>
</html>
